<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff1de" />
    <title>Agent Office</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="./lite.css" />
  </head>
  <body class="lite">
    <!-- The 2D view (lite.ts): the office as an app for a phone, one full-screen page at a time (lite/). -->
    <header class="lite-bar">
      <button id="lite-back" class="btn lite-back hidden" type="button" aria-label="Back">←</button>
      <div class="lite-heading">
        <h1 id="lite-title">Agent Office</h1>
        <p id="lite-sub" class="lite-subtitle hidden"></p>
      </div>
      <div id="lite-actions" class="lite-actions"></div>
      <div id="lite-global" class="lite-actions"><a id="to-3d" class="btn" href="/?3d=1" title="The 3D office, where you walk around" aria-label="The 3D office">3D</a></div>
    </header>
    <main id="screen" class="lite-main"></main>
    <nav id="lite-tabs" class="lite-nav" aria-label="Office"></nav>
    <div id="toasts"></div>
    <div id="conn" class="conn hidden">Reconnecting…</div>
    <div id="modal-root"></div>
    <script type="module" src="./lite.ts"></script>
  </body>
</html>
